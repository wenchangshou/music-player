plugins {
    id 'com.android.application' version '8.13.0'
}

def relayOrigin = providers.gradleProperty('tidalRelayOrigin').orElse('').get().trim()
if (relayOrigin) {
    def uri = new URI(relayOrigin)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo != null ||
            !(uri.path in ['', '/']) || uri.query != null || uri.fragment != null) {
        throw new GradleException('tidalRelayOrigin must be an HTTPS origin')
    }
    relayOrigin = "https://${uri.rawAuthority}"
}

android {
    buildFeatures {
        buildConfig = true
    }
    namespace 'com.tidalgui.player'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tidalgui.player'
        buildConfigField 'String', 'TIDAL_RELAY_ORIGIN', groovy.json.JsonOutput.toJson(relayOrigin)
        minSdk 23
        targetSdk 36
        versionCode 70
        versionName '0.6.60'
        testInstrumentationRunner "com.tidalgui.player.PlaybackSmoke"
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    testImplementation 'junit:junit:4.13.2'
    // The JSON classes of android.jar are stubs on the JVM.
    testImplementation 'org.json:json:20240303'
    testImplementation 'kxml2:kxml2:2.3.0'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
}
